<body>
<div id="c"></div>
<div id="hud"><h1>Smooth Organic Branch Manifold</h1>
Fast SDF + flood-fill surface nets + radius-aware QEM decimation.
<div class="m">Tris <b id="tri">0</b> · Verts <b id="vert">0</b> · <b id="ms">0</b> ms · cell <b id="cell">0</b></div></div>
<script>
const params = {
  overallHeight:5.2, baseDiameter:0.85, branchingDepth:2, branchesPerLevel:2, branchStartHeight:0.35,
  branchElevationDeg:52, branchLengthRatio:0.62, taperRatio:0.65, curvatureAmount:0.35,
  twigTipRadius:0.04,
  trunkSegments:8, branchSegments:6, bezierBlend:0.85, scatterAmount:0.12, scatterSeed:1337,
  jointFilletRadius:0.22, filletFollowsRadius:1.6, laplacianSmoothSteps:2,
  autoResolution:true, twigRingVerts:7, voxelCellSize:0.05, maxQuads:140000,
  decimateReduction:0.7, relError:0.08, crotchPreservation:3.5,
  displayMode:'both', showSkeleton:false, roughness:0.45, metalness:0.1,
  meshColor:'#a78bfa', wireframeColor:'#38bdf8',
  randomizeJitter:()=>{params.scatterSeed=Math.floor(Math.random()*99999);schedule(false);}
};
let scene,camera,renderer,controls,meshGroup,skelGroup,mat,wmat,_draft=false,_timer=0;

function makePRNG(seed){let s=(seed%2147483647)||1;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}
function bez(p0,p1,p2,p3,t){const u=1-t,p=new THREE.Vector3();
  p.addScaledVector(p0,u*u*u).addScaledVector(p1,3*u*u*t).addScaledVector(p2,3*u*t*t).addScaledVector(p3,t*t*t);return p;}

// ---------------- Skeleton ----------------
function buildSkeleton(c){
  const rng=makePRNG(c.scatterSeed),limbs=[],junctionPoints=[];let id=0;
  function limb(start,dir,len,r0,r1,segs,depth,parent){
    const lid='l'+id++,nodes=[],p0=start.clone(),p3=p0.clone().addScaledVector(dir,len);
    const arb=Math.abs(dir.y)<0.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0);
    const cd=new THREE.Vector3().crossVectors(dir,arb).normalize().applyAxisAngle(dir,rng()*Math.PI*2);
    const cs=c.curvatureAmount*len*(0.5+depth*0.3);
    const p1=p0.clone().addScaledVector(dir,len*.35).addScaledVector(cd,cs);
    const p2=p0.clone().addScaledVector(dir,len*.7).addScaledVector(cd,-cs*.5);
    for(let i=0;i<=segs;i++){
      const t=i/segs,b=bez(p0,p1,p2,p3,t);
      const js=(i===0&&depth===0)?0:c.scatterAmount*(1-c.bezierBlend)*len*.15;
      const j=new THREE.Vector3((rng()-.5)*2*js,(rng()-.5)*js,(rng()-.5)*2*js);
      nodes.push({position:b.clone().lerp(b.clone().add(j),1-c.bezierBlend*.4),radius:THREE.MathUtils.lerp(r0,r1,t)});
    }
    limbs.push({id:lid,depth,parentLimb:parent,nodes});
    if(depth<c.branchingDepth-1&&c.branchesPerLevel>0){
      const s0=Math.max(1,Math.floor(nodes.length*(depth===0?c.branchStartHeight:.35))),avail=nodes.length-1-s0;
      if(avail>0){
        const step=Math.max(1,Math.floor(avail/c.branchesPerLevel)),ang=THREE.MathUtils.degToRad(c.branchElevationDeg);
        for(let b=0;b<c.branchesPerLevel;b++){
          const ai=Math.min(nodes.length-2,s0+b*step),pn=nodes[ai],nn=nodes[ai+1];
          junctionPoints.push(pn.position.clone());
          const tan=new THREE.Vector3().subVectors(nn.position,pn.position).normalize();
          const up=Math.abs(tan.y)<.95?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0);
          const right=new THREE.Vector3().crossVectors(tan,up).normalize(),fwd=new THREE.Vector3().crossVectors(right,tan).normalize();
          const az=(b/c.branchesPerLevel)*Math.PI*2+(rng()-.5)*.7;
          const rad=new THREE.Vector3().addScaledVector(right,Math.cos(az)).addScaledVector(fwd,Math.sin(az)).normalize();
          const bd=new THREE.Vector3().addScaledVector(tan,Math.cos(ang)).addScaledVector(rad,Math.sin(ang)).normalize();
          const cl=len*c.branchLengthRatio*(.8+rng()*.35),cb=pn.radius*.65,ct=Math.max(c.twigTipRadius,cb*c.taperRatio);
          limb(pn.position,bd,cl,cb,ct,Math.max(3,c.branchSegments-depth),depth+1,lid);
        }
      }
    }
  }
  const tb=c.baseDiameter*.5;
  limb(new THREE.Vector3(0,0,0),new THREE.Vector3(0,1,0),c.overallHeight,tb,Math.max(.06,tb*c.taperRatio*.5),c.trunkSegments,0,null);
  return{limbs,junctionPoints};
}

// ---------------- Fast engine ----------------
// Flat-array SDF. Limbs are culled with an exact AABB lower bound; fillet k follows the child limb radius
// so thin twigs don't get balloon-sized blends. Analytic gradient + local radius come from one pass.
class TreeSDF{
  constructor(sk,K,ratio){
    const segs=[],lim=[];
    sk.limbs.forEach((L,li)=>{
      const s0=segs.length/8,mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];let mr=0;
      L.nodes.forEach((n,i)=>{const p=n.position,q=L.nodes[i+1];
        mn[0]=Math.min(mn[0],p.x);mn[1]=Math.min(mn[1],p.y);mn[2]=Math.min(mn[2],p.z);
        mx[0]=Math.max(mx[0],p.x);mx[1]=Math.max(mx[1],p.y);mx[2]=Math.max(mx[2],p.z);mr=Math.max(mr,n.radius);
        if(q)segs.push(p.x,p.y,p.z,q.position.x,q.position.y,q.position.z,n.radius,q.radius);});
      lim.push({s0,s1:segs.length/8,mn,mx,mr,k:li===0?0:Math.min(K,Math.max(.012,L.nodes[0].radius*ratio))});
    });
    this.S=new Float64Array(segs);this.L=lim;this.g=new Float64Array(3);this.rad=0;
  }
  eval(x,y,z,wg){
    const S=this.S,L=this.L;let d=1e9,gx=0,gy=0,gz=0,rd=0;
    for(let l=0;l<L.length;l++){
      const q=L[l];
      if(l>0){const dx=Math.max(q.mn[0]-x,0,x-q.mx[0]),dy=Math.max(q.mn[1]-y,0,y-q.mx[1]),dz=Math.max(q.mn[2]-z,0,z-q.mx[2]);
        if(Math.sqrt(dx*dx+dy*dy+dz*dz)-q.mr>d+q.k)continue;}
      let best=1e9,bi=q.s0;
      for(let s=q.s0;s<q.s1;s++){
        const o=s*8,ax=S[o],ay=S[o+1],az=S[o+2],bx=S[o+3]-ax,by=S[o+4]-ay,bz=S[o+5]-az,px=x-ax,py=y-ay,pz=z-az;
        const l2=bx*bx+by*by+bz*bz;let h=l2>1e-12?(px*bx+py*by+pz*bz)/l2:0;h=h<0?0:h>1?1:h;
        const ex=px-bx*h,ey=py-by*h,ez=pz-bz*h,v=Math.sqrt(ex*ex+ey*ey+ez*ez)-(S[o+6]+(S[o+7]-S[o+6])*h);
        if(v<best){best=v;bi=s;}
      }
      let lx=0,ly=0,lz=0,lr=0;
      if(wg){
        const o=bi*8,ax=S[o],ay=S[o+1],az=S[o+2],bx=S[o+3]-ax,by=S[o+4]-ay,bz=S[o+5]-az,px=x-ax,py=y-ay,pz=z-az;
        const l2=bx*bx+by*by+bz*bz,hr=l2>1e-12?(px*bx+py*by+pz*bz)/l2:0,h=hr<0?0:hr>1?1:hr;
        const ex=px-bx*h,ey=py-by*h,ez=pz-bz*h,dist=Math.sqrt(ex*ex+ey*ey+ez*ez),inv=dist>1e-9?1/dist:0,dr=S[o+7]-S[o+6];
        lx=ex*inv;ly=ey*inv;lz=ez*inv;
        if(hr>0&&hr<1){const t=dr/l2;lx-=t*bx;ly-=t*by;lz-=t*bz;}
        lr=S[o+6]+dr*h;
      }
      if(l===0){d=best;gx=lx;gy=ly;gz=lz;rd=lr;continue;}
      const diff=best-d,k=q.k;
      if(diff>=k)continue;
      if(diff<=-k){d=best;gx=lx;gy=ly;gz=lz;rd=lr;continue;}
      const h=(k-Math.abs(diff))/k,wn=diff<0?1-h*.5:h*.5,wo=1-wn;
      d=Math.min(d,best)-h*h*k*.25;gx=wo*gx+wn*lx;gy=wo*gy+wn*ly;gz=wo*gz+wn*lz;rd=wo*rd+wn*lr;
    }
    this.g[0]=gx;this.g[1]=gy;this.g[2]=gz;this.rad=rd;return d;
  }
  project(p,n){ // Newton steps onto the zero surface
    for(let i=0;i<n;i++){const d=this.eval(p[0],p[1],p[2],1),g=this.g,gg=g[0]*g[0]+g[1]*g[1]+g[2]*g[2];
      if(gg<1e-10)break;const t=d/gg;p[0]-=t*g[0];p[1]-=t*g[1];p[2]-=t*g[2];}
  }
}

// Open-addressing hash on integer (x,y,z) lattice keys: no string keys, no per-lookup allocation.
class GMap{
  constructor(){this.c=1<<14;this.n=0;this.alloc();}
  alloc(){const c=this.c;this.kx=new Int32Array(c);this.ky=new Int32Array(c);this.kz=new Int32Array(c);this.u=new Uint8Array(c);this.v=new Float32Array(c);}
  slot(x,y,z){const m=this.c-1;let h=(Math.imul(x,73856093)^Math.imul(y,19349663)^Math.imul(z,83492791))&m;
    while(this.u[h]){if(this.kx[h]===x&&this.ky[h]===y&&this.kz[h]===z)return h;h=(h+1)&m;}return -1-h;}
  set(x,y,z,val){let s=this.slot(x,y,z);if(s>=0){this.v[s]=val;return;}
    if((this.n+1)*2>this.c){this.grow();s=this.slot(x,y,z);}
    s=-1-s;this.kx[s]=x;this.ky[s]=y;this.kz[s]=z;this.u[s]=1;this.v[s]=val;this.n++;}
  grow(){const ox=this.kx,oy=this.ky,oz=this.kz,ou=this.u,ov=this.v,oc=this.c;this.c*=2;this.alloc();this.n=0;
    for(let i=0;i<oc;i++)if(ou[i])this.set(ox[i],oy[i],oz[i],ov[i]);}
}

// Narrow-band surface nets via flood fill from the tips: work scales with surface area, not volume.
function buildSurface(sk,sdf,cs){
  const corner=new GMap(),cells=new GMap(),V=new Float64Array(8),P=new Float64Array(3);
  const verts=[],ac=[],stack=[];
  const cv=(x,y,z)=>{const s=corner.slot(x,y,z);if(s>=0)return corner.v[s];const v=sdf.eval(x*cs,y*cs,z*cs,0);corner.set(x,y,z,v);return v;};
  const seed=(px,py,pz,dx,dy,dz)=>{
    let t=0;for(let i=0;i<800&&sdf.eval(px+dx*t,py+dy*t,pz+dz*t,0)<0;i++)t+=cs*.5;
    const sx=Math.floor((px+dx*t)/cs),sy=Math.floor((py+dy*t)/cs),sz=Math.floor((pz+dz*t)/cs);
    for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)for(let c=-1;c<=1;c++)stack.push(sx+a,sy+b,sz+c);
  };
  sk.limbs.forEach((L,li)=>{ // seed every limb tip (twigs stay reachable even if thinner than a cell)
    const n=L.nodes,a=n[n.length-1].position,b=n[n.length-2].position,d=a.clone().sub(b).normalize();
    seed(a.x,a.y,a.z,d.x,d.y,d.z);
    if(li===0){const f=n[0].position;seed(f.x,f.y,f.z,-d.x*0+0,-1,0);}
  });
  while(stack.length){
    const cz=stack.pop(),cy=stack.pop(),cx=stack.pop();
    if(cells.slot(cx,cy,cz)>=0)continue;
    let ins=0,out=0;
    for(let c=0;c<8;c++){const v=cv(cx+(c&1),cy+((c>>1)&1),cz+(c>>2));V[c]=v;if(v<=0)ins=1;else out=1;}
    if(!(ins&&out)){cells.set(cx,cy,cz,-1);continue;}
    let sx=0,sy=0,sz=0,n=0;
    for(let c=0;c<8;c++)for(let b=0;b<3;b++){
      if(c&(1<<b))continue;const a=V[c],e=V[c|(1<<b)];if((a<=0)===(e<=0))continue;const t=a/(a-e);
      sx+=(cx+(c&1)+(b===0?t:0))*cs;sy+=(cy+((c>>1)&1)+(b===1?t:0))*cs;sz+=(cz+(c>>2)+(b===2?t:0))*cs;n++;
    }
    P[0]=sx/n;P[1]=sy/n;P[2]=sz/n;sdf.project(P,2);
    cells.set(cx,cy,cz,verts.length/3);verts.push(P[0],P[1],P[2]);ac.push(cx,cy,cz);
    for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)for(let c=-1;c<=1;c++)
      if((a|b|c)&&cells.slot(cx+a,cy+b,cz+c)<0)stack.push(cx+a,cy+b,cz+c);
  }
  const idx=[],OFF=[[-1,-1],[0,-1],[0,0],[-1,0]],q=[0,0,0,0],cc=[0,0,0];
  const dist=(i,j)=>Math.hypot(verts[i*3]-verts[j*3],verts[i*3+1]-verts[j*3+1],verts[i*3+2]-verts[j*3+2]);
  for(let i=0;i<ac.length;i+=3){
    const x=ac[i],y=ac[i+1],z=ac[i+2],v0=cv(x,y,z);
    for(let ax=0;ax<3;ax++){
      const v1=cv(x+(ax===0),y+(ax===1),z+(ax===2));
      if((v0<=0)===(v1<=0))continue;
      const u=ax===0?1:0,w=ax===2?1:2;let ok=true;
      for(let k=0;k<4;k++){cc[0]=x;cc[1]=y;cc[2]=z;cc[u]+=OFF[k][0];cc[w]+=OFF[k][1];
        const s=cells.slot(cc[0],cc[1],cc[2]),id=s>=0?cells.v[s]:-1;if(id<0){ok=false;break;}q[k]=id;}
      if(!ok)continue;
      if((v0<=0)===(ax===1)){const t=q[1];q[1]=q[3];q[3]=t;}
      if(dist(q[0],q[2])<=dist(q[1],q[3]))idx.push(q[0],q[1],q[2],q[0],q[2],q[3]);
      else idx.push(q[1],q[2],q[3],q[1],q[3],q[0]);
    }
  }
  let vol=0;
  for(let t=0;t<idx.length;t+=3){const a=idx[t]*3,b=idx[t+1]*3,c=idx[t+2]*3;
    vol+=verts[a]*(verts[b+1]*verts[c+2]-verts[b+2]*verts[c+1])-verts[a+1]*(verts[b]*verts[c+2]-verts[b+2]*verts[c])+verts[a+2]*(verts[b]*verts[c+1]-verts[b+1]*verts[c]);}
  if(vol<0)for(let t=0;t<idx.length;t+=3){const s=idx[t+1];idx[t+1]=idx[t+2];idx[t+2]=s;}
  return{pos:Float64Array.from(verts),idx};
}

// Tangential relaxation, re-projected onto the SDF so thin tubes never shrink.
function relax(pos,idx,sdf,iters,lam){
  const n=pos.length/3,S=new Float64Array(n*3),C=new Float64Array(n),P=new Float64Array(3);
  for(let it=0;it<iters;it++){
    S.fill(0);C.fill(0);
    for(let t=0;t<idx.length;t+=3)for(let j=0;j<3;j++){
      const a=idx[t+j],b=idx[t+(j+1)%3];
      for(let k=0;k<3;k++){S[a*3+k]+=pos[b*3+k];S[b*3+k]+=pos[a*3+k];}C[a]++;C[b]++;}
    for(let v=0;v<n;v++){if(!C[v])continue;
      for(let k=0;k<3;k++)P[k]=pos[v*3+k]+lam*(S[v*3+k]/C[v]-pos[v*3+k]);
      sdf.project(P,1);pos[v*3]=P[0];pos[v*3+1]=P[1];pos[v*3+2]=P[2];}
  }
}

// Quadric edge-collapse decimation. Plane errors are weighted by 1/localRadius^2, so error is *relative*:
// thick limbs collapse to coarse facets while thin twigs keep their rings. Junctions get extra weight.
// Link-condition + normal-flip checks keep the mesh manifold; new verts are re-projected onto the SDF.
function decimate(pos,idx,sdf,K,o){
  const nv=pos.length/3,nf=idx.length/3,P=pos,F=Int32Array.from(idx);
  const alive=new Uint8Array(nf).fill(1),dead=new Uint8Array(nv),ver=new Int32Array(nv);
  const vf=Array.from({length:nv},()=>[]);
  for(let t=0;t<nf;t++)for(let j=0;j<3;j++)vf[F[t*3+j]].push(t);
  const w=new Float64Array(nv),Q=new Float64Array(nv*10),J=o.junctions,K2=K*K*2.25;
  for(let v=0;v<nv;v++){
    sdf.eval(P[v*3],P[v*3+1],P[v*3+2],1);const r=Math.max(sdf.rad,.01);let wt=1/(r*r);
    for(const j of J){const dx=P[v*3]-j.x,dy=P[v*3+1]-j.y,dz=P[v*3+2]-j.z;wt*=1+o.crotchPreservation*Math.exp(-(dx*dx+dy*dy+dz*dz)/K2);}
    w[v]=wt;
  }
  for(let t=0;t<nf;t++){
    const a=F[t*3],b=F[t*3+1],c=F[t*3+2];
    const ux=P[b*3]-P[a*3],uy=P[b*3+1]-P[a*3+1],uz=P[b*3+2]-P[a*3+2],vx=P[c*3]-P[a*3],vy=P[c*3+1]-P[a*3+1],vz=P[c*3+2]-P[a*3+2];
    let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;const l=Math.hypot(nx,ny,nz);if(l<1e-14)continue;
    nx/=l;ny/=l;nz/=l;const d=-(nx*P[a*3]+ny*P[a*3+1]+nz*P[a*3+2]),wf=(w[a]+w[b]+w[c])/3;
    const m=[nx*nx,nx*ny,nx*nz,nx*d,ny*ny,ny*nz,ny*d,nz*nz,nz*d,d*d];
    for(const vi of[a,b,c])for(let k=0;k<10;k++)Q[vi*10+k]+=wf*m[k];
  }
  const qe=(a,b,x,y,z)=>{const g=k=>Q[a*10+k]+Q[b*10+k];
    return g(0)*x*x+2*g(1)*x*y+2*g(2)*x*z+2*g(3)*x+g(4)*y*y+2*g(5)*y*z+2*g(6)*y+g(7)*z*z+2*g(8)*z+g(9);};
  const ec=(u,v)=>{const ux=P[u*3],uy=P[u*3+1],uz=P[u*3+2],vx=P[v*3],vy=P[v*3+1],vz=P[v*3+2];
    return Math.min(qe(u,v,ux,uy,uz),qe(u,v,vx,vy,vz),qe(u,v,(ux+vx)/2,(uy+vy)/2,(uz+vz)/2));};
  const H=[];
  const push=e=>{let i=H.length;H.push(e);while(i>0){const p=(i-1)>>1;if(H[p].c<=e.c)break;H[i]=H[p];i=p;}H[i]=e;};
  const pop=()=>{const top=H[0],last=H.pop();
    if(H.length){let i=0;const n=H.length;for(;;){let l=2*i+1;if(l>=n)break;if(l+1<n&&H[l+1].c<H[l].c)l++;if(H[l].c>=last.c)break;H[i]=H[l];i=l;}H[i]=last;}
    return top;};
  const seen=new Set();
  for(let t=0;t<nf;t++)for(let j=0;j<3;j++){
    const a=F[t*3+j],b=F[t*3+(j+1)%3],lo=Math.min(a,b),hi=Math.max(a,b),key=lo*nv+hi;
    if(!seen.has(key)){seen.add(key);push({c:ec(lo,hi),u:lo,v:hi,su:0,sv:0});}
  }
  const bad=(t,self,x,y,z,other)=>{
    const a=F[t*3],b=F[t*3+1],c=F[t*3+2];if(a===other||b===other||c===other)return false;
    const ax=P[a*3],ay=P[a*3+1],az=P[a*3+2],bx=P[b*3],by=P[b*3+1],bz=P[b*3+2],cx=P[c*3],cy=P[c*3+1],cz=P[c*3+2];
    const nrm=(ax,ay,az,bx,by,bz,cx,cy,cz)=>{const e1x=bx-ax,e1y=by-ay,e1z=bz-az,e2x=cx-ax,e2y=cy-ay,e2z=cz-az;
      return[e1y*e2z-e1z*e2y,e1z*e2x-e1x*e2z,e1x*e2y-e1y*e2x];};
    const o1=nrm(ax,ay,az,bx,by,bz,cx,cy,cz);
    const n1=nrm(a===self?x:ax,a===self?y:ay,a===self?z:az,b===self?x:bx,b===self?y:by,b===self?z:bz,c===self?x:cx,c===self?y:cy,c===self?z:cz);
    const lo=Math.hypot(o1[0],o1[1],o1[2]),ln=Math.hypot(n1[0],n1[1],n1[2]);
    return ln<1e-12||(o1[0]*n1[0]+o1[1]*n1[1]+o1[2]*n1[2])<.25*lo*ln;
  };
  let left=nf;const target=Math.floor(nf*(1-o.decimateReduction)),maxC=o.relError*o.relError*8,N=new Float64Array(3);
  while(H.length&&left>target){
    const e=pop(),u=e.u,v=e.v;
    if(dead[u]||dead[v]||ver[u]!==e.su||ver[v]!==e.sv)continue;
    if(e.c>maxC)break;
    const fu=vf[u]=vf[u].filter(t=>alive[t]),fv=vf[v]=vf[v].filter(t=>alive[t]);
    const nu=new Set(),nvs=new Set();let shared=0;
    for(const t of fu)for(let j=0;j<3;j++){const q=F[t*3+j];if(q!==u)nu.add(q);}
    for(const t of fv){let hu=false;for(let j=0;j<3;j++){const q=F[t*3+j];if(q===u)hu=true;else if(q!==v)nvs.add(q);}if(hu)shared++;}
    let common=0;for(const q of nvs)if(nu.has(q))common++;
    if(shared!==2||common!==2)continue;
    const ux=P[u*3],uy=P[u*3+1],uz=P[u*3+2],vx=P[v*3],vy=P[v*3+1],vz=P[v*3+2];
    const c1=qe(u,v,ux,uy,uz),c2=qe(u,v,vx,vy,vz),mx=(ux+vx)/2,my=(uy+vy)/2,mz=(uz+vz)/2,c3=qe(u,v,mx,my,mz);
    if(c3<=c1&&c3<=c2){N[0]=mx;N[1]=my;N[2]=mz;sdf.project(N,1);}
    else if(c1<=c2){N[0]=ux;N[1]=uy;N[2]=uz;}else{N[0]=vx;N[1]=vy;N[2]=vz;}
    let ok=true;
    for(const t of fu)if(bad(t,u,N[0],N[1],N[2],v)){ok=false;break;}
    if(ok)for(const t of fv)if(bad(t,v,N[0],N[1],N[2],u)){ok=false;break;}
    if(!ok)continue;
    P[u*3]=N[0];P[u*3+1]=N[1];P[u*3+2]=N[2];dead[v]=1;
    for(const t of fv){
      for(let j=0;j<3;j++)if(F[t*3+j]===v)F[t*3+j]=u;
      const a=F[t*3],b=F[t*3+1],c=F[t*3+2];
      if(a===b||b===c||a===c){alive[t]=0;left--;}else vf[u].push(t);
    }
    for(let k=0;k<10;k++)Q[u*10+k]+=Q[v*10+k];
    ver[u]++;
    const nb=new Set();
    for(const t of vf[u])if(alive[t])for(let j=0;j<3;j++){const q=F[t*3+j];if(q!==u)nb.add(q);}
    for(const q of nb)push({c:ec(u,q),u,v:q,su:ver[u],sv:ver[q]});
  }
  const map=new Int32Array(nv).fill(-1),op=[],oi=[];
  for(let t=0;t<nf;t++)if(alive[t])for(let j=0;j<3;j++){
    const q=F[t*3+j];if(map[q]<0){map[q]=op.length/3;op.push(P[q*3],P[q*3+1],P[q*3+2]);}oi.push(map[q]);}
  return{pos:Float64Array.from(op),idx:oi};
}

let lastCell=0;
function generateSmoothTreeMesh(sk,o){
  const t0=performance.now(),K=Math.max(.02,o.jointFilletRadius);
  const sdf=new TreeSDF(sk,K,o.filletFollowsRadius);
  let area=0,minR=1e9;
  sk.limbs.forEach(L=>L.nodes.forEach((n,i)=>{minR=Math.min(minR,n.radius);const m=L.nodes[i+1];
    if(m)area+=Math.PI*(n.radius+m.radius)*n.position.distanceTo(m.position);}));
  // Auto: cell size follows the thinnest twig (ring vertices per twig circumference), capped by a quad budget.
  let cs=o.autoResolution?2*Math.PI*minR/o.twigRingVerts:o.voxelCellSize;
  cs=Math.min(.2,Math.max(.012,cs,Math.sqrt(area/o.maxQuads)));
  if(o.draft)cs*=1.7;
  lastCell=cs;
  let{pos,idx}=buildSurface(sk,sdf,cs);
  if(!o.draft&&o.laplacianSmoothSteps>0)relax(pos,idx,sdf,o.laplacianSmoothSteps,.35);
  if(!o.draft&&o.decimateReduction>.02){
    const r=decimate(pos,idx,sdf,K,{...o,junctions:sk.junctionPoints});pos=r.pos;idx=r.idx;}
  const n=pos.length/3,pf=new Float32Array(n*3),nf=new Float32Array(n*3);
  for(let v=0;v<n;v++){
    sdf.eval(pos[v*3],pos[v*3+1],pos[v*3+2],1);const g=sdf.g,l=Math.hypot(g[0],g[1],g[2])||1;
    nf[v*3]=g[0]/l;nf[v*3+1]=g[1]/l;nf[v*3+2]=g[2]/l;pf[v*3]=pos[v*3];pf[v*3+1]=pos[v*3+1];pf[v*3+2]=pos[v*3+2];}
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pf,3));
  geo.setAttribute('normal',new THREE.BufferAttribute(nf,3));
  geo.setIndex(new THREE.BufferAttribute(Uint32Array.from(idx),1));
  geo.userData.ms=performance.now()-t0;
  return geo;
}

// ---------------- App ----------------
function skeletonViz(sk){
  const g=new THREE.Group(),m=new THREE.LineBasicMaterial({color:0x38bdf8});
  sk.limbs.forEach(L=>g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(L.nodes.map(n=>n.position)),m)));
  return g;
}
function clear(g){if(!g)return;scene.remove(g);g.traverse(c=>c.geometry&&c.geometry.dispose());}
function updateTree(){
  clear(meshGroup);clear(skelGroup);skelGroup=null;
  meshGroup=new THREE.Group();scene.add(meshGroup);
  const sk=buildSkeleton(params);
  const geo=generateSmoothTreeMesh(sk,{...params,draft:_draft});
  document.getElementById('tri').textContent=(geo.index.count/3).toLocaleString();
  document.getElementById('vert').textContent=geo.attributes.position.count.toLocaleString();
  document.getElementById('ms').textContent=geo.userData.ms.toFixed(0)+(_draft?' (draft)':'');
  document.getElementById('cell').textContent=lastCell.toFixed(3);
  mat.color.set(params.meshColor);mat.roughness=params.roughness;mat.metalness=params.metalness;wmat.color.set(params.wireframeColor);
  const m=params.displayMode;
  if(m!=='wireframe'){const s=new THREE.Mesh(geo,mat);s.castShadow=s.receiveShadow=true;meshGroup.add(s);}
  if(m!=='shaded'){wmat.polygonOffset=m==='both';wmat.polygonOffsetFactor=1;wmat.polygonOffsetUnits=1;meshGroup.add(new THREE.Mesh(geo,wmat));}
  if(params.showSkeleton){skelGroup=skeletonViz(sk);scene.add(skelGroup);}
}
// Sliders rebuild a fast draft while dragging, then the full build on release.
function schedule(draft){_draft=draft;clearTimeout(_timer);_timer=setTimeout(updateTree,draft?25:0);}

function init(){
  scene=new THREE.Scene();scene.background=new THREE.Color(0x0c111d);
  camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(3.5,3.8,6.5);
  renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;
  document.getElementById('c').appendChild(renderer.domElement);
  controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,2.2,0);
  scene.add(new THREE.HemisphereLight(0xe2e8f0,0x1e293b,.75));
  const dl=new THREE.DirectionalLight(0xffffff,1.25);dl.position.set(5,10,7);dl.castShadow=true;scene.add(dl);
  const bl=new THREE.DirectionalLight(0x38bdf8,.6);bl.position.set(-5,4,-5);scene.add(bl);
  const grid=new THREE.GridHelper(12,24,0x334155,0x1e293b);grid.position.y=-.01;scene.add(grid);
  mat=new THREE.MeshStandardMaterial({color:params.meshColor});wmat=new THREE.MeshBasicMaterial({color:params.wireframeColor,wireframe:true});
  updateTree();setupGUI();
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
  (function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);})();
}
function setupGUI(){
  const gui=new lil.GUI({title:'Smooth Tree Controls'});
  const live=c=>c.onChange(()=>schedule(true)).onFinishChange(()=>schedule(false));
  const A=(f,k,a,b,s,n)=>live(f.add(params,k,a,b,s).name(n));
  let f=gui.addFolder('Tree architecture');
  A(f,'overallHeight',2.5,12,.25,'Height');A(f,'baseDiameter',.3,2.2,.05,'Base diameter');
  A(f,'branchingDepth',1,3,1,'Hierarchy levels');A(f,'branchesPerLevel',1,4,1,'Branches per tier');
  A(f,'branchStartHeight',.15,.75,.05,'Crown base');A(f,'branchElevationDeg',25,80,1,'Spread angle');
  A(f,'branchLengthRatio',.4,.85,.02,'Branch length ratio');A(f,'taperRatio',.4,.85,.02,'Taper');
  A(f,'curvatureAmount',0,.8,.02,'Curvature');A(f,'twigTipRadius',.015,.08,.005,'Twig tip radius');
  f=gui.addFolder('Nodes & scatter');
  A(f,'trunkSegments',4,16,1,'Trunk nodes');A(f,'branchSegments',3,12,1,'Branch nodes');
  A(f,'bezierBlend',0,1,.05,'Bezier vs scatter');A(f,'scatterAmount',0,.4,.02,'Scatter');
  f.add(params,'randomizeJitter').name('Randomize scatter');
  f=gui.addFolder('Mesher (speed / twigs)');
  live(f.add(params,'autoResolution').name('Twig-aware resolution'));
  A(f,'twigRingVerts',5,14,1,'Verts around twig');A(f,'voxelCellSize',.015,.15,.005,'Manual cell size');
  A(f,'maxQuads',20000,400000,10000,'Quad budget');A(f,'jointFilletRadius',.02,.6,.02,'Max fillet radius');
  A(f,'filletFollowsRadius',.5,4,.1,'Fillet / child radius');A(f,'laplacianSmoothSteps',0,5,1,'Relax steps');
  f=gui.addFolder('Decimation (radius-aware QEM)');
  A(f,'decimateReduction',0,.95,.05,'Target reduction');A(f,'relError',.01,.3,.01,'Max relative error');
  A(f,'crotchPreservation',0,6,.25,'Junction protection');
  f=gui.addFolder('Display');f.close();
  f.add(params,'displayMode',['shaded','wireframe','both']).onChange(()=>schedule(false));
  f.add(params,'showSkeleton').onChange(()=>schedule(false));
  f.addColor(params,'meshColor').onChange(()=>schedule(false));f.addColor(params,'wireframeColor').onChange(()=>schedule(false));
  f.add(params,'roughness',0,1,.05).onChange(v=>mat.roughness=v);f.add(params,'metalness',0,1,.05).onChange(v=>mat.metalness=v);
}
window.onload=init;
